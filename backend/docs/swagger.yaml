basePath: /
definitions:
  internal_api.ConferenceCup:
    properties:
      qf:
        description: QF[0]=1v4, QF[1]=2v3
        items:
          $ref: '#/definitions/internal_api.CupGame'
        type: array
      seeds:
        description: index 0 = seed 1, index 3 = wildcard
        items:
          type: string
        type: array
      sf:
        $ref: '#/definitions/internal_api.CupGame'
    type: object
  internal_api.ConferencePlayIn:
    properties:
      game1:
        $ref: '#/definitions/internal_api.PlayInGame'
      game2:
        $ref: '#/definitions/internal_api.PlayInGame'
      game3:
        $ref: '#/definitions/internal_api.PlayInGame'
      playoff_7:
        type: string
      playoff_8:
        type: string
    type: object
  internal_api.CupBracket:
    properties:
      east:
        $ref: '#/definitions/internal_api.ConferenceCup'
      final:
        $ref: '#/definitions/internal_api.CupGame'
      west:
        $ref: '#/definitions/internal_api.ConferenceCup'
    type: object
  internal_api.CupGame:
    properties:
      away:
        type: string
      away_score:
        type: integer
      counted:
        type: boolean
      home:
        type: string
      home_score:
        type: integer
      winner:
        type: string
    type: object
  internal_api.DraftPick:
    properties:
      pick:
        example: 1
        type: integer
      seed:
        example: 1
        type: integer
      team_id:
        example: DET
        type: string
    type: object
  internal_api.ErrorResponse:
    properties:
      error:
        example: unknown team id
        type: string
    type: object
  internal_api.GameEvent:
    properties:
      away_score:
        example: 98
        type: integer
      clock_sec:
        example: 45
        type: integer
      home_score:
        example: 105
        type: integer
      period:
        example: Q4
        type: string
      points:
        example: 2
        type: integer
      possession:
        example: 1
        type: integer
      team:
        example: home
        type: string
      text:
        example: Lakers make_2pt (2 pts)
        type: string
      type:
        example: make_2pt
        type: string
    type: object
  internal_api.GameState:
    properties:
      away_id:
        example: BOS
        type: string
      away_name:
        example: Celtics
        type: string
      away_score:
        example: 98
        type: integer
      clock_sec:
        example: 0
        type: integer
      home_id:
        example: LAL
        type: string
      home_name:
        example: Lakers
        type: string
      home_score:
        example: 105
        type: integer
      offense:
        description: omitted when status is final
        example: home
        type: string
      period:
        example: Q4
        type: string
      possession:
        example: 201
        type: integer
      quarter:
        example: 4
        type: integer
      status:
        example: final
        type: string
    type: object
  internal_api.ListTeamsResponse:
    properties:
      teams:
        items:
          $ref: '#/definitions/internal_api.TeamOption'
        type: array
    type: object
  internal_api.PlayInGame:
    properties:
      away:
        type: string
      away_score:
        type: integer
      home:
        type: string
      home_score:
        type: integer
      loser:
        type: string
      winner:
        type: string
    type: object
  internal_api.PlayInTeams:
    properties:
      seed7:
        example: MIL
        type: string
      seed8:
        example: MIA
        type: string
      seed9:
        example: CHI
        type: string
      seed10:
        example: ATL
        type: string
    type: object
  internal_api.SimulateDraftLotteryRequest:
    properties:
      seed:
        example: 42
        type: integer
      teams:
        items:
          type: string
        type: array
    type: object
  internal_api.SimulateDraftLotteryResponse:
    properties:
      picks:
        items:
          $ref: '#/definitions/internal_api.DraftPick'
        type: array
      seed:
        example: 42
        type: integer
    type: object
  internal_api.SimulatePlayInRequest:
    properties:
      east:
        $ref: '#/definitions/internal_api.PlayInTeams'
      seed:
        example: 42
        type: integer
      west:
        $ref: '#/definitions/internal_api.PlayInTeams'
    type: object
  internal_api.SimulatePlayInResponse:
    properties:
      east:
        $ref: '#/definitions/internal_api.ConferencePlayIn'
      seed:
        type: integer
      west:
        $ref: '#/definitions/internal_api.ConferencePlayIn'
    type: object
  internal_api.SimulateRequest:
    properties:
      away_team_id:
        example: BOS
        type: string
      home_team_id:
        example: LAL
        type: string
      seed:
        example: 42
        type: integer
    type: object
  internal_api.SimulateResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/internal_api.GameEvent'
        type: array
      seed:
        example: 42
        type: integer
      state:
        $ref: '#/definitions/internal_api.GameState'
      truncated:
        example: false
        type: boolean
    type: object
  internal_api.SimulateSeasonRequest:
    properties:
      seed:
        example: 42
        type: integer
    type: object
  internal_api.SimulateSeasonResponse:
    properties:
      cup:
        $ref: '#/definitions/internal_api.CupBracket'
      season:
        type: string
      seed:
        type: integer
      standings:
        items:
          $ref: '#/definitions/internal_api.TeamSeasonStat'
        type: array
    type: object
  internal_api.TeamOption:
    properties:
      id:
        example: LAL
        type: string
      name:
        example: Lakers
        type: string
    type: object
  internal_api.TeamSeasonStat:
    properties:
      away_record:
        example: 24-17
        type: string
      diff:
        example: 4.4
        type: number
      home_record:
        example: 30-11
        type: string
      l:
        example: 28
        type: integer
      last_10:
        example: 7-3
        type: string
      oppg:
        example: 109.8
        type: number
      ppg:
        example: 114.2
        type: number
      streak:
        example: W3
        type: string
      team_id:
        example: LAL
        type: string
      team_name:
        example: Lakers
        type: string
      w:
        example: 54
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Possession-by-possession NBA game simulator API.
  title: Sim1.0 API
  version: "1.0"
paths:
  /simulate:
    post:
      consumes:
      - application/json
      description: Runs possessions until the game clock ends. Same seed produces
        the same game.
      parameters:
      - description: Home/away team ids and optional seed
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.SimulateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.SimulateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Simulate a full game
      tags:
      - simulate
  /simulate/draft-lottery:
    post:
      consumes:
      - application/json
      description: Runs the NBA draft lottery for 14 teams using official ball-combination
        odds. Picks 1-4 are drawn by weighted lottery; picks 5-14 go to remaining
        teams in seed order.
      parameters:
      - description: 14 team IDs in lottery-seed order (index 0 = worst record)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.SimulateDraftLotteryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.SimulateDraftLotteryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Simulate the NBA draft lottery
      tags:
      - simulate
  /simulate/playin:
    post:
      consumes:
      - application/json
      description: 'Runs all 6 play-in games (3 per conference). Game 1: 7 hosts 8
        — winner = 7 seed. Game 2: 9 hosts 10. Game 3: loser of G1 hosts winner of
        G2 — winner = 8 seed.'
      parameters:
      - description: Play-in team IDs for each conference
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.SimulatePlayInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.SimulatePlayInResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Simulate the NBA play-in tournament
      tags:
      - simulate
  /simulate/season:
    post:
      consumes:
      - application/json
      description: Runs every game in the 2025-26 schedule and returns standings with
        W, L, streak, last-10, home/away records, PPG, OPPG, and DIFF.
      parameters:
      - description: Optional seed for reproducibility
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_api.SimulateSeasonRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.SimulateSeasonResponse'
      summary: Simulate a full NBA regular season
      tags:
      - simulate
  /teams:
    get:
      description: Returns team ids and names from teams.json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.ListTeamsResponse'
      summary: List all teams
      tags:
      - teams
swagger: "2.0"
