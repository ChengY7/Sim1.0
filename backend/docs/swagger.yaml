basePath: /
definitions:
  internal_api.ErrorResponse:
    properties:
      error:
        example: unknown team id
        type: string
    type: object
  internal_api.GameEvent:
    properties:
      away_score:
        example: 98
        type: integer
      clock_sec:
        example: 45
        type: integer
      home_score:
        example: 105
        type: integer
      period:
        example: Q4
        type: string
      points:
        example: 2
        type: integer
      possession:
        example: 1
        type: integer
      team:
        example: home
        type: string
      text:
        example: Lakers make_2pt (2 pts)
        type: string
      type:
        example: make_2pt
        type: string
    type: object
  internal_api.GameState:
    properties:
      away_id:
        example: BOS
        type: string
      away_name:
        example: Celtics
        type: string
      away_score:
        example: 98
        type: integer
      clock_sec:
        example: 0
        type: integer
      home_id:
        example: LAL
        type: string
      home_name:
        example: Lakers
        type: string
      home_score:
        example: 105
        type: integer
      offense:
        example: home
        type: string
      period:
        example: Q4
        type: string
      possession:
        example: 201
        type: integer
      quarter:
        example: 4
        type: integer
      status:
        example: final
        type: string
    type: object
  internal_api.ListTeamsResponse:
    properties:
      teams:
        items:
          $ref: '#/definitions/internal_api.TeamOption'
        type: array
    type: object
  internal_api.SimulateRequest:
    properties:
      away_team_id:
        example: BOS
        type: string
      home_team_id:
        example: LAL
        type: string
      seed:
        example: 42
        type: integer
    type: object
  internal_api.SimulateResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/internal_api.GameEvent'
        type: array
      seed:
        example: 42
        type: integer
      state:
        $ref: '#/definitions/internal_api.GameState'
      truncated:
        example: false
        type: boolean
    type: object
  internal_api.TeamOption:
    properties:
      id:
        example: LAL
        type: string
      name:
        example: Lakers
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Possession-by-possession NBA game simulator API.
  title: Sim1.0 API
  version: "1.0"
paths:
  /simulate:
    post:
      consumes:
      - application/json
      description: Runs possessions until the game clock ends. Same seed produces
        the same game.
      parameters:
      - description: Home/away team ids and optional seed
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.SimulateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.SimulateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Simulate a full game
      tags:
      - simulate
  /teams:
    get:
      description: Returns team ids and names from teams.json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.ListTeamsResponse'
      summary: List all teams
      tags:
      - teams
swagger: "2.0"
